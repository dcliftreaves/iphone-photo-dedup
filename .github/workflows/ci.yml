name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q photo_dedup
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e .
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run build
      - run: npm --prefix desktop audit --audit-level=high
      - run: npx --prefix desktop playwright install --with-deps chromium webkit
      - run: npm --prefix desktop test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: interface-test-results
          path: desktop/test-results/
          retention-days: 7
